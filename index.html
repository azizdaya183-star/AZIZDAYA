<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZIZ DAYA | Blog tech</title>
<meta name="description" content="AZIZ DAYA : actualités tech, tutoriels et astuces simples pour téléphone, PC et internet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#101828;--mute:#5b6577;--line:#dde2ec;--acc:#1f4fe0;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--surface:#151c2e;--ink:#eaeef7;--mute:#9aa6bd;--line:#26304a;--acc:#6b93ff;--acc-ink:#0e1320}}
:root[data-theme="dark"]{--bg:#0e1320;--surface:#151c2e;--ink:#eaeef7;--mute:#9aa6bd;--line:#26304a;--acc:#6b93ff;--acc-ink:#0e1320}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px}
.badge{background:#d92d20;color:#fff;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:4px;line-height:1.3;white-space:nowrap}
.badge:hover{background:#b42318}
.brand{min-width:0;flex-wrap:wrap;row-gap:4px}
@media (max-width:480px){.top{gap:8px}.logo{font-size:1.2rem}.badge{font-size:.58rem;padding:2px 5px;white-space:normal;max-width:96px;line-height:1.2}#theme{padding:5px 8px;font-size:.78rem;flex-shrink:0}.hero{padding:18px}.wrap{padding:0 14px}}
.logo{font-weight:700;font-size:1.5rem;letter-spacing:.02em}
.logo i{display:inline-block;width:.55em;height:1em;background:var(--acc);margin-left:5px;vertical-align:-.12em}
#theme{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav a{white-space:nowrap;padding:6px 14px;border-radius:999px;color:var(--mute);font-weight:500}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--acc);color:var(--acc-ink)}
main{padding:32px 0 56px;min-height:70vh}
.hero{display:block;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:32px;margin-bottom:32px}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;margin:8px 0 12px}
.hero p{color:var(--mute);font-size:1.1rem;max-width:60ch;margin:0 0 12px}
.cat{color:var(--acc);font-weight:700;font-size:.9rem}
time{color:var(--mute);font-size:.9rem}
.cols{display:grid;grid-template-columns:1fr 280px;gap:40px}
.row{display:block;padding:20px 0;border-bottom:1px solid var(--line)}
.row h3{margin:4px 0;font-size:1.3rem;line-height:1.3}
.row:hover h3{color:var(--acc)}
.row p{margin:0 0 6px;color:var(--mute)}
aside h4{margin:0 0 10px}
aside a{display:block;padding:7px 0;border-bottom:1px solid var(--line);color:var(--mute)}
aside a:hover{color:var(--acc)}
.ad{margin-top:28px;border:1px dashed var(--line);border-radius:10px;min-height:250px;display:grid;place-items:center;color:var(--mute);font-size:.85rem;text-align:center;padding:10px}
.rail{display:flex;flex-direction:column;gap:28px}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.photo{position:relative;aspect-ratio:3/4;background:var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:.85rem;text-align:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.about{max-width:260px;margin-bottom:24px}
.profile h4{margin:12px 0 2px;font-size:1.1rem}
.profile p{margin:0;color:var(--mute);font-size:.92rem}
article{max-width:700px;margin:0 auto}
article h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.15;margin:8px 0}
.prose{font-family:"Source Serif 4",Georgia,serif;font-size:1.15rem;line-height:1.8}
.prose h2{font-family:"Space Grotesk",sans-serif;margin-top:2em}
.prose code{background:var(--surface);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
.back{display:inline-block;margin-bottom:16px;color:var(--mute)}
h2.t{margin:0 0 4px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:28px 0;color:var(--mute);font-size:.95rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a:hover{color:var(--acc)}
@media (max-width:820px){.cols{grid-template-columns:1fr;gap:24px}.rail{display:contents}.profile{order:-1;display:flex;gap:14px;align-items:center}.profile .photo{width:104px;flex-shrink:0}.profile .txt{min-width:0}.profile h4{margin-top:0}.hero{padding:22px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><a class="logo" href="#/">AZIZ DAYA<i></i></a><a class="badge" href="#/page/contact">Ouvert aux collaborations</a></div>
      <button id="theme" type="button" aria-label="Changer de thème">Mode sombre</button>
    </div>
    <nav id="nav" aria-label="Catégories"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> AZIZ DAYA. Tous droits réservés.</span>
    <span><a href="#/page/a-propos">À propos</a> &nbsp; <a href="#/page/contact">Contact</a> &nbsp; <a href="#/page/confidentialite">Confidentialité</a></span>
  </div>
</footer>

<script>
/* ============================================================
   POUR AJOUTER UN ARTICLE : copie un bloc { ... }, colle-le
   juste en dessous du dernier (avec une virgule entre les deux)
   et change : slug, titre, cat, date, resume, contenu.
   - slug : sans espace ni accent (ex: "installer-whatsapp")
   - cat  : Tech, Tutoriels, Astuces, Bons plans ou Divers
   - date : AAAA-MM-JJ
   ============================================================ */
const ARTICLES = [
  {
    slug: "aziz-daya",
    titre: "AZIZ DAYA",
    cat: "Divers",
    date: "2026-10-17",
    resume: "Ce que tu vas trouver ici : de la tech expliquée simplement, des tutoriels et des astuces utiles.",
    contenu: `<p>Sur AZIZ DAYA, on parle surtout de tech : smartphones, applications, internet, intelligence artificielle.</p>
    <h2>Ce que tu vas trouver</h2>
    <p>Des tutoriels pas à pas, des astuces pour gagner du temps, des bons plans et d’autres sujets qui me passionnent.</p>
    <p>Reviens régulièrement : de nouveaux articles arrivent bientôt.</p>`
  },
  {
    slug: "5-astuces-economiser-batterie-telephone",
    titre: "5 astuces pour économiser la batterie de ton téléphone",
    cat: "Astuces",
    date: "2026-10-16",
    resume: "Des réglages simples qui prolongent la durée de ta batterie sans rien installer.",
    contenu: `<p>Une batterie qui se vide trop vite est le problème numéro un. Voici cinq réglages faciles.</p>
    <h2>1. Baisse la luminosité</h2><p>L’écran consomme le plus. Active la luminosité automatique.</p>
    <h2>2. Ferme les applis inutiles</h2><p>Vérifie dans les réglages quelles applis consomment le plus.</p>
    <h2>3. Coupe le Bluetooth et la localisation</h2><p>Désactive-les quand tu ne t’en sers pas.</p>
    <h2>4. Active le mode économie d’énergie</h2><p>Il limite les activités en arrière-plan.</p>
    <h2>5. Mets à jour ton système</h2><p>Les mises à jour corrigent souvent des problèmes de consommation.</p>`
  },
  {
    slug: "comment-creer-un-compte-google",
    titre: "Comment créer un compte Google gratuitement",
    cat: "Tutoriels",
    date: "2026-10-15",
    resume: "Un compte Google ouvre l’accès à Gmail, YouTube, Drive et bien plus. Voici comment le créer.",
    contenu: `<p>Un compte Google est gratuit et donne accès à de nombreux services.</p>
    <h2>Les étapes</h2>
    <p>1. Va sur <code>accounts.google.com</code> et clique sur « Créer un compte ».</p>
    <p>2. Entre ton nom, choisis une adresse Gmail et un mot de passe solide.</p>
    <p>3. Ajoute un numéro de téléphone pour sécuriser ton compte, puis valide le code reçu.</p>
    <p>Ton compte est prêt.</p>`
  }
];

const CATS = ["Tech", "Tutoriels", "Astuces", "Bons plans", "Divers"];

const PAGES = {
  "a-propos": { titre: "À propos", html: `<p>AZIZ DAYA est un blog qui parle surtout de tech, avec des tutoriels, des astuces et des bons plans expliqués simplement.</p><p>Remplace ce texte par ta propre présentation : qui tu es, pourquoi tu écris, ce que les lecteurs y gagnent.</p>` },
  "contact": { titre: "Contact", html: `<p>Une question, une suggestion, une collaboration ? Écris-moi :</p><p><a href="mailto:ton-email@exemple.com"><strong>ton-email@exemple.com</strong></a></p>` },
  "confidentialite": { titre: "Politique de confidentialité", html: `<p>AZIZ DAYA respecte ta vie privée. Ce site peut utiliser des outils de mesure d’audience (comme Google Analytics) et, plus tard, de la publicité (comme Google AdSense). Ces services peuvent utiliser des cookies pour fonctionner.</p><p>Tu peux refuser ou supprimer les cookies dans les réglages de ton navigateur. Nous ne vendons aucune donnée personnelle.</p><p>Pour toute question, utilise la page Contact.</p>` }
};

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const fmt = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
const sorted = [...ARTICLES].sort((a, b) => b.date.localeCompare(a.date));

const row = a => `<a class="row" href="#/article/${a.slug}"><span class="cat">${a.cat}</span><h3>${a.titre}</h3><p>${a.resume}</p><time>${fmt(a.date)}</time></a>`;
const photo = `<div class="photo"><span>Ta photo ici</span><img src="photo.jpg" alt="Portrait de AZIZ DAYA" onerror="this.remove()"></div>`;
const photoAbout = photo.replace('class="photo"','class="photo about"');
const side = () => `<div class="rail"><div class="profile">${photo}<div class="txt"><h4>AZIZ DAYA</h4><p>Passionné de tech. Tutoriels, astuces et bons plans.</p></div></div><aside><h4>Catégories</h4>${CATS.map(c => `<a href="#/categorie/${encodeURIComponent(c)}">${c}</a>`).join("")}<div class="ad">Espace publicitaire<br>(Google AdSense plus tard)</div></aside></div>`;

function setTitle(t) { document.title = t ? `${t} | AZIZ DAYA` : "AZIZ DAYA | Blog tech"; }

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const type = parts[0], val = decodeURIComponent(parts.slice(1).join("/"));
  let on = "";
  if (type === "article") {
    const a = ARTICLES.find(x => x.slug === val);
    if (a) {
      on = a.cat; setTitle(a.titre);
      app.innerHTML = `<article><a class="back" href="#/">← Retour</a><div class="cat">${a.cat}</div><h1>${a.titre}</h1><time>${fmt(a.date)}</time><div class="prose">${a.contenu}</div></article>`;
    } else notFound();
  } else if (type === "categorie") {
    on = val; setTitle(val);
    const list = sorted.filter(a => a.cat === val);
    app.innerHTML = `<div class="cols"><section><h2 class="t">${val}</h2>${list.length ? list.map(row).join("") : "<p>Aucun article dans cette catégorie pour le moment.</p>"}</section>${side()}</div>`;
  } else if (type === "page" && PAGES[val]) {
    setTitle(PAGES[val].titre);
    app.innerHTML = `<article><a class="back" href="#/">← Retour</a><h1>${PAGES[val].titre}</h1>${val === "a-propos" ? photoAbout : ""}<div class="prose">${PAGES[val].html}</div></article>`;
  } else if (!type) {
    on = "home"; setTitle("");
    const [first, ...rest] = sorted;
    app.innerHTML = `<a class="hero" href="#/article/${first.slug}"><span class="cat">${first.cat}</span><h1>${first.titre}</h1><p>${first.resume}</p><time>${fmt(first.date)}</time></a><div class="cols"><section><h2 class="t">Derniers articles</h2>${rest.map(row).join("")}</section>${side()}</div>`;
  } else notFound();
  nav.innerHTML = `<a href="#/" class="${on === "home" ? "on" : ""}">Accueil</a>` + CATS.map(c => `<a href="#/categorie/${encodeURIComponent(c)}" class="${on === c ? "on" : ""}">${c}</a>`).join("");
  window.scrollTo(0, 0);
}
function notFound() { setTitle("Page introuvable"); app.innerHTML = `<article><h1>Page introuvable</h1><p><a href="#/">Retour à l’accueil</a></p></article>`; }

const btn = document.getElementById("theme");
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); btn.textContent = t === "dark" ? "Mode clair" : "Mode sombre"; }
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { theme = localStorage.getItem("theme") || theme; } catch (e) {}
applyTheme(theme);
btn.onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(theme); try { localStorage.setItem("theme", theme); } catch (e) {} };

document.getElementById("yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
