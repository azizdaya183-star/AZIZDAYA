    contenu: `<p>Tu postes des vidéos, tu fais des vues… et ton compte en banque reste vide. C’est le quotidien de beaucoup de créateurs. Une plateforme appelée Promote (« Promote It ») promet de changer ça : être payé pour chaque vue vérifiée, sans minimum d’abonnés. Voici comment elle fonctionne, et ce qu’il faut vérifier avant de t’y lancer.</p>

    contenu: `<p>« Ma religion est la vérité. » Presque toutes les grandes traditions le disent, et l’islam n’y échappe pas. Alors, l’islam est-il vraiment la vérité ? Aucun article ne peut trancher à ta place : mais on peut comprendre ce que les musulmans croient, comment les autres en parlent, et comment aborder la question avec honnêteté.</p>

    <h2>Ce que croient les musulmans</h2>
    <p>L’islam repose sur la foi en un Dieu unique (Allah), l’unicité de Dieu étant appelée <em>tawhid</em>. Les musulmans croient que Mahomet est le dernier prophète, et que le Coran est la parole de Dieu qui lui a été révélée. Les « cinq piliers » structurent la pratique : la profession de foi, la prière, l’aumône, le jeûne du ramadan et le pèlerinage à La Mecque pour ceux qui le peuvent. Pour eux, l’islam est la confirmation et l’aboutissement du message des prophètes précédents, dont Abraham, Moïse et Jésus.</p>
    <h2>Une religion mondiale</h2>
    <p>Selon les estimations des instituts démographiques, l’islam rassemble près de deux milliards de personnes dans le monde, soit environ un quart de l’humanité, avec une grande diversité : sunnites, chiites, soufis, et des cultures très différentes de l’Afrique à l’Asie.</p>
    <h2>Ce qu’en disent les autres</h2>
    <p>Les chrétiens et les juifs reconnaissent plusieurs figures communes (Abraham, Moïse), mais ne reconnaissent pas Mahomet comme prophète ni le Coran comme révélation finale. Les athées et les agnostiques estiment, eux, que les affirmations religieuses ne peuvent être prouvées. D’autres traditions (hindouisme, bouddhisme) abordent la vérité spirituelle autrement. Chaque regard s’appuie sur sa propre conception de ce qu’est la vérité.</p>

    <h2>Comment aborder la question honnêtement</h2>
    <p>Lis les textes de première main (une traduction du Coran, par exemple, avec des notes d’érudits). Écoute les croyants eux-mêmes, plutôt que les caricatures venues des réseaux sociaux. Compare avec d’autres traditions. Distingue la religion de la conduite de certaines personnes qui s’en réclament. Et accepte que la réponse soit un cheminement personnel.</p>
    <h2>Le respect avant tout</h2>

    <p>Depuis le 8 mai 2025, le pape est Léon XIV (Robert Prevost, né à Chicago), le 267e pape de l’Église catholique. Pour les catholiques, le pape est l’évêque de Rome et le successeur de l’apôtre Pierre. Il est le chef de l’Église, mais pas une divinité.</p>
    <h2>Le pape est-il considéré comme un dieu ?</h2>
    <p>Non. Les catholiques adorent Dieu, qu’ils conçoivent comme Trinité (Père, Fils, Esprit). Le pape est un homme, qui prie, se confesse et peut se tromper. Le dogme de l’infaillibilité ne s’applique que dans des conditions très précises (déclaration solennelle en matière de foi ou de morale) et ne signifie pas que le pape est parfait.</p>
    <h2>D’où viennent les rumeurs ?</h2>
    <p><strong>Les fausses citations :</strong> en 2025, des mèmes attribuaient au pape des phrases qu’il n’a jamais dites. <strong>Les vidéos truquées :</strong> Vatican News a mis en garde contre un deepfake de 36 minutes qui utilisait une voix générée par IA. <strong>Les faux comptes :</strong> en mars 2026, un faux compte intitulé « Papa Léon XIV » a répandu l’idée d’une hospitalisation après un accident, démentie par une vérification des faits. <strong>Les interprétations de symboles :</strong> certaines théories voient du satanisme dans l’architecture, les vêtements ou les rituels du Vatican, sans preuve solide, en isolant des détails de leur contexte.</p>

    contenu: `<p>Que se passe-t-il quand on meurt ? Chaque religion répond à sa façon. Le judaïsme, lui, est célèbre pour une chose surprenante : il parle peu de l’au-delà, et ne donne pas une réponse unique. Voici ce que dit la tradition.</p>
    <h2>Une religion tournée vers cette vie</h2>
    <p>Le judaïsme met l’accent sur la vie présente, appelée <em>olam ha-zé</em> (« ce monde »), sur les actes, la justice et la responsabilité envers les autres. La Torah elle-même ne contient pas de description claire de la vie après la mort : les morts y descendent au <em>Shéol</em>, un séjour obscur et silencieux.</p>
    <h2>Le monde à venir : Olam Haba</h2>
    <p>Avec le temps, la tradition rabbinique développe la notion d’<em>Olam Haba</em>, le « monde à venir ». Selon les textes, ce terme peut désigner l’existence de l’âme après la mort, ou le monde qui suivra la venue du Messie. Une phrase célèbre compare ce monde à un vestibule avant la salle du banquet : il faut s’y préparer pour pouvoir entrer.</p>

    <p>Deux idées coexistent. Pour beaucoup, l’âme survit à la mort du corps et comparaît devant Dieu. Par ailleurs, la <em>résurrection des morts</em> (<em>Techiyat Hametim</em>) est une croyance centrale du judaïsme traditionnel, que Maïmonide a placée parmi les 13 principes de la foi. Cette croyance distinguait déjà les pharisiens des sadducéens à l’époque du Second Temple.</p>

    contenu: `<p>« Le paradis se vit sur terre. » Entendue dans une chanson, un discours ou une conversation, cette phrase provoque des réactions opposées. Certains y voient une invitation à profiter du présent. D’autres la jugent dangereuse, parfois même « satanique ». Que veut-elle dire, et pourquoi divise-t-elle ?</p>

    <h2>Ce que disent les traditions</h2>
    <p>Dans le christianisme, l’idée du Royaume de Dieu est présentée à la fois comme déjà présent et pas encore pleinement accompli. Dans l’islam, la vie d’ici-bas (<em>dunya</em>) est souvent décrite comme un temps d’épreuve avant la vie future (<em>akhira</em>). Dans le judaïsme, l’accent est mis sur ce monde et sur le devoir de le réparer. D’autres traditions, comme le bouddhisme, parlent de paix intérieure atteignable dès cette vie.</p>

    resume: "Batterie de 8 500 mAh, deux capteurs de 200 Mpx, 250 dollars de moins : Xiaomi défie Apple. Qui gagne vraiment ?",
    contenu: `<p>Septembre 2026. Apple dévoile son iPhone 18 Pro Max. Quelques jours plus tard, Xiaomi répond avec un smartphone qui coche presque toutes les cases… pour moins cher. Les comparatifs s’enflamment : le roi de la Silicon Valley est-il détrôné ? Voici ce que disent les fiches techniques, et ce qu’elles ne disent pas.</p>

    <p>Xiaomi mise sur deux capteurs de 200 mégapixels et un de 50 mégapixels, avec un selfie de 50 mégapixels. Apple reste sur un triple 48 mégapixels, avec un selfie de 18 mégapixels. Les spécialistes estiment que Xiaomi prend l’avantage en photo, tandis qu’Apple conserve la main sur la vidéo.</p>

    <p>Fais chauffer l’huile à feu moyen et plonge-y les frites sans surcharger. Retire-les quand elles sont tendres mais encore pâles, laisse-les reposer quelques minutes, puis replonge-les dans l’huile plus chaude jusqu’à ce qu’elles soient dorées. Sale à la sortie.</p>

    <p>Fais revenir un peu d’oignon, ajoute les tomates écrasées (ou deux cuillères de concentré avec un peu d’eau), un trait de vinaigre ou de citron, une cuillère de sucre et du sel. Laisse mijoter 15 à 20 minutes, puis mixe ou écrase pour obtenir une sauce lisse. Elle se garde quelques jours au frais dans un pot propre.</p>
    <h2>Pour aller plus loin</h2>
    <p>Ajoute du paprika, de l’ail en poudre ou un peu de piment sur les frites chaudes. Accompagne-les d’un œuf ou d’une salade de tomates pour un vrai repas.</p>
    <p>Pas de grand budget, mais un grand plaisir : quelques pommes de terre bien traitées suffisent à sauver ta soirée.</p>`

    contenu: `<p>L’écran est figé, la souris ne bouge plus, le ventilateur gronde. Ton cœur s’accélère : et ton travail non enregistré ? Respire. Il existe une façon d’éteindre ton PC qui bug, et l’ordre des gestes change tout.</p>

    resume: "La croix ne marche plus, la fenêtre est gelée : du raccourci simple à la commande de secours, voici comment reprendre le contrôle.",
    contenu: `<p>Tu cliques sur la croix. Rien. Tu recliques. Toujours rien. La fenêtre « Ne répond pas » te fixe, immobile, comme si elle te défiait. Pas de panique : voici quatre façons de reprendre le contrôle, de la plus douce à la plus ferme.</p>
    <h2>1. Le raccourci Alt + F4</h2>
    <p>Clique sur la fenêtre bloquée pour la sélectionner, puis appuie sur <code>Alt + F4</code>. Windows demande au programme de se fermer. Si le programme est seulement lent, cela suffit souvent.</p>
    <h2>2. Le Gestionnaire des tâches</h2>
    <p>Appuie sur <code>Ctrl + Maj + Échap</code>. Dans l’onglet « Processus », cherche le programme concerné, clique dessus avec le bouton droit et choisis « Fin de tâche ». Windows ferme alors le programme de force, même s’il est gelé.</p>
    <h2>3. L’onglet Détails</h2>
    <p>Si le programme se cache ou revient tout seul, va dans l’onglet « Détails » du Gestionnaire des tâches, repère le processus (son nom finit souvent par <code>.exe</code>) et termine-le. Certains programmes lancent plusieurs processus : ferme-les tous.</p>
    <h2>4. La commande de secours</h2>
    <p>Ouvre l’invite de commandes (tape « cmd » dans le menu Démarrer). Écris <code>tasklist</code> pour afficher la liste des processus, puis <code>taskkill /f /im nomduprogramme.exe</code> pour forcer la fermeture. Par exemple : <code>taskkill /f /im notepad.exe</code>.</p>
    <h2>Que faire ensuite ?</h2>
    <p>Un programme qui se fige souvent est un signal. Mets-le à jour, redémarre ton PC, vérifie que tu as assez de mémoire disponible. Si le problème revient, réinstalle-le. Et sauvegarde régulièrement ton travail : un gel peut surgir à tout moment.</p>`

    contenu: `<p>Ton PC rame soudain. Des fenêtres publicitaires surgissent de nulle part. Un programme que tu n’as jamais installé tourne en arrière-plan. Quelque chose cloche, et tu n’as pas envie de payer un antivirus. Bonne nouvelle : Windows embarque déjà sa propre défense.</p>
    <h2>D’abord, un mot d’honnêteté</h2>
    <p>Aucune méthode ne garantit un nettoyage à 100 %. Et méfie-toi des « nettoyeurs miracles » trouvés en ligne : beaucoup sont eux-mêmes des arnaques ou des logiciels malveillants. Les outils officiels de Windows sont plus sûrs.</p>
    <h2>Étape 1 : coupe internet</h2>
    <p>Si tu suspectes un virus, déconnecte le Wi-Fi ou débranche le câble. Cela empêche un programme malveillant d’envoyer tes données ou d’en télécharger d’autres.</p>
    <h2>Étape 2 : démarre en mode sans échec</h2>

    <p>Dans <code>Paramètres &gt; Applications</code>, désinstalle tout programme que tu ne reconnais pas. Dans le Gestionnaire des tâches (<code>Ctrl + Maj + Échap</code>), ouvre l’onglet « Applications de démarrage » et désactive ce qui est suspect. Supprime aussi les extensions inconnues de ton navigateur.</p>

    <p>Quand le PC est propre, change tes mots de passe importants (e-mail, banque, réseaux sociaux), depuis un appareil sain si possible.</p>
    <h2>Le dernier recours</h2>
    <p>Si le problème persiste, sauvegarde tes fichiers importants puis utilise « Réinitialiser ce PC » dans les paramètres. C’est radical, mais efficace.</p>
    <h2>Comment éviter la rechute</h2>

    contenu: `<p>Tu ouvres un site : une pub plein écran. Tu lis un article : une autre vidéo qui démarre toute seule. Pire, une annonce s’affiche au milieu de ton écran d’accueil, sans aucune application ouverte. Les publicités envahissantes gâchent l’expérience, mais tu peux reprendre la main.</p>

    <p>C’est la méthode la plus efficace, sans rien installer. Va dans <code>Paramètres &gt; Réseau et Internet &gt; DNS privé</code>, choisis « Nom d’hôte du fournisseur DNS privé » et écris <code>dns.adguard-dns.com</code>. Ce service filtre une grande partie des publicités dans les navigateurs et les applications.</p>

    sub: "Finance personnelle",

    resume: "Le test de la valise pour savoir si tu as un vrai business ou juste un emploi déguisé, et 8 idées qui répondent à des besoins qui ne disparaissent pas.",
    contenu: `<p>À l’époque de nos parents, la formule était simple : de bonnes études, un bon poste, et la vie était réglée. Aujourd’hui, des entreprises licencient, l’intelligence artificielle automatise des postes entiers et les salaires ne suivent pas toujours l’inflation. Dépendre d’un seul salaire est devenu un pari risqué.</p>
    <p>La bonne nouvelle : certains besoins ne changent jamais, et des business reposent exactement dessus. Voici huit idées, après un test simple pour savoir si ce que tu construis est un vrai business ou un emploi que tu t’es créé toi-même.</p>
    <h2>Le test de la valise</h2>
    <p>Imagine que tu pars deux semaines en montagne, téléphone éteint, ordinateur fermé, sans prévenir personne. À ton retour, de l’argent est-il rentré pendant ton absence ? Si oui, tu as un business. Sinon, tu as un emploi, même si ta carte de visite dit « fondateur ».</p>
    <p>Un plombier, un professeur particulier ou un coiffeur indépendant qui s’arrête deux semaines ne gagne rien : c’est un emploi, sans congés payés ni protection. Un vrai business est un système qui continue de tourner sans toi.</p>
    <p><strong>Avant de continuer :</strong> les chiffres ci-dessous sont des ordres de grandeur annoncés dans une vidéo qui parle du contexte français, en euros. Ce ne sont ni des promesses ni des conseils financiers. Vérifie les prix, les règles et les licences dans ton pays avant d’investir quoi que ce soit.</p>
    <h2>1. La dark kitchen</h2>
    <p>Une cuisine sans salle ni vitrine, qui prépare des repas uniquement pour la livraison. Le principe : un chef cuisine, des livreurs de plateformes livrent, et depuis une seule cuisine tu peux lancer plusieurs marques (burgers, plats healthy, tacos), avec le même loyer et la même équipe. Un local discret en zone semi-industrielle suffit et réduit fortement le loyer.</p>
    <p><strong>L’erreur à éviter :</strong> tout faire toi-même pour économiser. Tu te retrouves seul cuisinier de ta propre cuisine, et le test de la valise est raté. Embauche un chef dès le début et concentre-toi sur les menus, les prix et la gestion des plateformes. Ordre de grandeur cité : 15 000 à 25 000 € pour démarrer.</p>
    <h2>2. L’entretien de climatisation et de pompes à chaleur</h2>
    <p>Le business n’est pas de réparer une clim, mais de construire un système autour de son entretien. Avec le réchauffement climatique, les équipements se multiplient, et en France l’entretien de certains équipements, comme les chaudières, est obligatoire chaque année. Cette contrainte se transforme en <strong>contrat d’entretien annuel</strong>, un revenu récurrent. L’exemple cité : 120 à 180 € par an et par installation, et des contrats professionnels (bureaux, hôpitaux, centres commerciaux) bien plus importants.</p>
    <p>Pour démarrer : un statut simple, deux ou trois techniciens qualifiés, un outillage de base et un numéro connu dans ton secteur. <strong>L’erreur à éviter :</strong> casser tes prix par peur de perdre un client. Mieux vaut moins de clients bien facturés que beaucoup de contrats qui te font travailler à perte.</p>
    <h2>3. La laverie automatique</h2>
    <p>Un business peu glamour mais peu concurrencé. Laver une machine coûte quelques euros de ressources, alors que le client paie nettement plus : les marges citées vont de 40 à 50 %. Les machines travaillent, pas une grosse équipe. Même en période de crise, les gens lavent leurs vêtements. L’investissement est plus lourd : la vidéo cite 80 000 à 150 000 € en franchise, avec un retour sur investissement de 2 à 3 ans.</p>
    <p><strong>L’erreur à éviter :</strong> choisir un emplacement uniquement parce que le loyer est bas. Une laverie a besoin de passage régulier : étudiants, immeubles sans buanderie, quartiers denses.</p>
    <h2>4. La formation privée et le cours en ligne</h2>
    <p>Pas de cours particuliers en direct, qui ratent le test de la valise, mais une formation enregistrée une fois et vendue indéfiniment. Tu n’as pas besoin d’être un expert mondial : il suffit de maîtriser quelque chose que d’autres veulent apprendre, comme une langue, Excel, la cuisine, la guitare ou le sport à la maison. On construit d’abord une audience avec du contenu gratuit, puis on lance la formation payante sur une plateforme de cours ou sur son propre site.</p>
    <p><strong>L’erreur à éviter :</strong> attendre une formation parfaite avant de publier. Une formation imparfaite mais en ligne rapporte plus qu’une formation parfaite restée dans un tiroir. Et sois réaliste : bâtir une audience demande du temps.</p>
    <h2>5. La location de matériel</h2>
    <p>Tu achètes un objet et tu le loues plusieurs fois : mini-engins de chantier, matériel photo et vidéo, décoration de mariage (tentes, chaises, éclairage), vélos électriques ou trottinettes dans les zones touristiques. Selon la vidéo, un drone loué 150 € la journée peut être rentabilisé en quelques jours de location.</p>
    <p><strong>L’erreur à éviter :</strong> louer sans caution ni contrat clair. Sans cadre, tu risques de perdre ton matériel ou de le récupérer abîmé sans recours.</p>
    <h2>6. La chaîne de salons de coiffure et d’esthétique</h2>
    <p>Un besoin humain fondamental : même en crise, les gens vont chez le coiffeur. L’idée est de passer d’un salon à deux, puis trois, et même de proposer ton concept en franchise, avec une redevance mensuelle des franchisés. Un salon bien structuré peut fonctionner sans ta présence constante, avec des protocoles clairs. La vidéo cite 2 000 à 4 000 € de profit net mensuel par salon, et 100 000 à 200 000 € pour une franchise.</p>
    <p><strong>L’erreur à éviter :</strong> rester bloqué sur un seul salon en pensant que le deuxième t’obligera à être partout à la fois.</p>
    <h2>7. L’électronique reconditionnée</h2>
    <p>Racheter du matériel d’occasion (téléphones, ordinateurs, tablettes, consoles), le réparer, le contrôler et le revendre avec garantie. On peut démarrer petit : quelques téléphones, des réparations simples (batterie, écran) et une revente avec une marge par appareil. Quand les gens ont moins d’argent, ils achètent moins de neuf et davantage de reconditionné : la demande peut même augmenter en période de crise.</p>
    <p><strong>L’erreur à éviter :</strong> négliger le contrôle qualité. Un seul client déçu par un appareil mal reconditionné peut détruire ta réputation avec un avis négatif.</p>
    <h2>8. La marque blanche et le packaging privé</h2>
    <p>Tu choisis un produit fabriqué par une usine ou un producteur, tu crées ta marque et ton emballage, puis tu le vends en ligne. Beaucoup de marques de distributeurs fonctionnent ainsi : elles font de la marque, pas de la fabrication. Exemple de la vidéo : acheter du miel en gros, le mettre en pots personnalisés et le vendre nettement plus cher, pour une marge intéressante par pot. Quand ta fiche produit est en ligne et que les avis arrivent, les plateformes peuvent t’apporter des clients.</p>
    <p><strong>L’erreur à éviter :</strong> choisir un produit juste parce qu’il est à la mode. Un produit du quotidien qui se vend année après année vaut mieux qu’une mode qui passe en six mois.</p>
    <h2>Le schéma derrière ces 8 business</h2>
    <p>Trois points communs. Ils répondent à un <strong>besoin quotidien</strong> (manger, se laver, se former, se déplacer, se coiffer). Ils reposent sur un <strong>système</strong> qui tourne sans toi : une équipe, des machines, une plateforme. Et ils peuvent <strong>grandir par paliers</strong> : d’une unité à deux, puis à cinq, puis en franchise. Sans ces trois éléments, ce que tu construis reste un emploi, et il n’y a aucune honte à cela, mais autant le savoir.</p>
    <h2>Pas besoin d’une fortune pour commencer</h2>
    <p>Un business démarre rarement avec beaucoup d’argent. Il démarre avec une idée claire de ce qu’est un vrai système. Beaucoup de grandes enseignes ont commencé avec un magasin, une machine ou un seul appareil réparé à la main. Commence petit, teste, puis structure.</p>
    <h2>Ton exercice dès aujourd’hui</h2>
    <p>Prends ton activité actuelle ou ton projet et applique-lui le test de la valise. Si l’argent continuerait d’arriver pendant ton absence, bravo. Sinon, demande-toi comment construire un système autour, comment te rendre remplaçable, comment passer d’une personne à deux, puis à cinq. Un emploi tourne grâce à ton effort ; un business tourne grâce à un système.</p>`

    <p>Ensuite, tu crées une annonce sur Weelify en texte, image ou vidéo, avec une destination : conversation WhatsApp, site, groupe ou canal. Tu fixes ton prix pour 1 000 vues et ton budget, et tu cibles le pays qui t’intéresse. Seules les vues vérifiées sont débitées. Commence petit, teste ce qui marche, puis augmente. Si tu t’es inscrit avec mon lien, les 2 $ offerts lors de ta première recharge s’ajoutent à ton budget et t’aident à lancer ton premier test.</p>

const CATS = ["Tech", "IA", "Tutoriels", "Astuces", "Bons plans"];
const SUBS = ["Cuisine", "Finance personnelle", "Religion", "Santé", "Sport", "Musique"];
const AD_AFTER = 900; /* pub après ~900 caractères (≈ 10 à 15 lignes) : change ce nombre si besoin */
const AD = `<div class="ad-inline">Publicité<br>(Google AdSense plus tard)</div>`;

/* Texte de présentation affiché sur l'accueil : modifie-le librement */
const PROFIL = [
  "Je suis Aziz Daya, passionné de technologie et de marketing digital. Je travaille aussi comme community manager et je crée des visuels publicitaires.",
  "Sur ce blog, je partage des tutoriels, des astuces, des découvertes autour de l’IA et des idées pour gagner de l’argent en ligne, expliqués simplement."
];

const PAGES = {
  "a-propos": { titre: "À propos", html: `<p>AZIZ DAYA est un blog qui parle surtout de tech, avec des tutoriels, des astuces et des bons plans expliqués simplement.</p><p>Remplace ce texte par ta propre présentation : qui tu es, pourquoi tu écris, ce que les lecteurs y gagnent.</p>` },
  "contact": { titre: "Contact", html: `<p>Une question, une suggestion, une collaboration ? Écris-moi :</p><p><a href="mailto:azizdaya183@gmail.com"><strong>azizdaya183@gmail.com</strong></a></p>` },

};

const app = document.getElementById("app");
const nav = document.getElementById("nav");
const fmt = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
const sorted = [...ARTICLES].sort((a, b) => b.date.localeCompare(a.date));
const enc = encodeURIComponent;

const thumb = a => `<div class="thumb"><span>${a.sub || a.cat}</span><img src="${a.slug}.jpg" alt="${a.titre}" loading="lazy" onerror="this.remove()"></div>`;
const row = a => `<a class="row" href="${a.slug}.html">${thumb(a)}<h3>${a.titre}</h3></a>`;
const side = () => `<aside><h4>Catégories</h4>${CATS.concat("Divers").map(c => `<a href="#/categorie/${enc(c)}">${c}</a>`).join("")}<div class="ad">Espace publicitaire<br>(Google AdSense plus tard)</div></aside>`;
const subsBar = on => `<div class="subs">${SUBS.map(s => `<a href="#/divers/${enc(s)}" class="${s === on ? "on" : ""}">${s}</a>`).join("")}</div>`;
const listOrEmpty = l => l.length ? l.map(row).join("") : "<p>Aucun article pour le moment.</p>";

/* insère une petite pub après ~10 à 15 lignes de texte (jamais tout à la fin) */
function withAd(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  const k = [...d.children];
  let n = 0;
  for (let i = 0; i < k.length - 1; i++) {
    n += k[i].textContent.length;
    if (n >= AD_AFTER) { k[i].insertAdjacentHTML("afterend", AD); break; }
  }
  return d.innerHTML;
}

function setTitle(t) { document.title = t ? `${t} | AZIZ DAYA` : "AZIZ DAYA | Blog tech"; }

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const type = parts[0], val = decodeURIComponent(parts.slice(1).join("/"));
  let on = "";
  if (type === "article") {
    const a = ARTICLES.find(x => x.slug === val);
    if (a) {
      on = a.cat; setTitle(a.titre);
      app.innerHTML = `<article><a class="back" href="#/">← Retour</a><div class="cat">${a.sub ? a.cat + " / " + a.sub : a.cat}</div><h1>${a.titre}</h1><time>${fmt(a.date)}</time>${thumb(a)}<div class="prose">${withAd(a.contenu)}</div></article>`;
    } else notFound();
  } else if (type === "categorie" && (CATS.includes(val) || val === "Divers")) {
    on = val; setTitle(val);
    const list = sorted.filter(a => a.cat === val);
    app.innerHTML = `<div class="cols"><section><h2 class="t">${val}</h2>${val === "Divers" ? subsBar("") : ""}${listOrEmpty(list)}</section>${side()}</div>`;
  } else if (type === "divers" && SUBS.includes(val)) {
    on = "Divers"; setTitle(val);
    const list = sorted.filter(a => a.cat === "Divers" && a.sub === val);
    app.innerHTML = `<div class="cols"><section><h2 class="t">Divers : ${val}</h2>${subsBar(val)}${listOrEmpty(list)}</section>${side()}</div>`;
  } else if (type === "page" && PAGES[val]) {
    setTitle(PAGES[val].titre);
    app.innerHTML = `<article><a class="back" href="#/">← Retour</a><h1>${PAGES[val].titre}</h1><div class="prose">${PAGES[val].html}</div></article>`;
  } else if (!type) {
    on = "home"; setTitle("");
    const main = sorted.filter(a => a.cat !== "Divers");
    app.innerHTML = `<section class="hero"><div><h1>AZIZ DAYA</h1>${PROFIL.map(p => `<p>${p}</p>`).join("")}<a class="btn" href="#/page/contact">Me contacter</a></div><div class="photo"><span>Ta photo ici</span><img src="photo.jpg" alt="Portrait de AZIZ DAYA" onerror="this.remove()"></div></section><div class="cols"><section><h2 class="t">Derniers articles</h2>${listOrEmpty(main)}</section>${side()}</div>`;
  } else notFound();
  nav.innerHTML = `<a href="#/" class="${on === "home" ? "on" : ""}">Accueil</a>` + CATS.map(c => `<a href="#/categorie/${enc(c)}" class="${on === c ? "on" : ""}">${c}</a>`).join("") +
    `<button type="button" class="ddbtn ${on === "Divers" ? "on" : ""}" aria-haspopup="true" aria-expanded="false">Divers ▾</button><div class="menu" id="menu"><a href="#/categorie/Divers">Tout Divers</a>${SUBS.map(s => `<a href="#/divers/${enc(s)}">${s}</a>`).join("")}</div>`;
  window.scrollTo(0, 0);
}
function notFound() { setTitle("Page introuvable"); app.innerHTML = `<article><h1>Page introuvable</h1><p><a href="#/">Retour à l’accueil</a></p></article>`; }

/* liste déroulante Divers */
nav.addEventListener("click", e => {
  const b = e.target.closest(".ddbtn");
  if (b) b.setAttribute("aria-expanded", document.getElementById("menu").classList.toggle("open"));
});
document.addEventListener("click", e => {
  const m = document.getElementById("menu");
  if (m && !e.target.closest(".ddbtn") && !e.target.closest(".menu")) {
    m.classList.remove("open");
    nav.querySelector(".ddbtn").setAttribute("aria-expanded", "false");
  }
});

const btn = document.getElementById("theme");
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); btn.textContent = t === "dark" ? "Mode clair" : "Mode sombre"; }
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { theme = localStorage.getItem("theme") || theme; } catch (e) {}
applyTheme(theme);
btn.onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(theme); try { localStorage.setItem("theme", theme); } catch (e) {} };

document.getElementById("yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
